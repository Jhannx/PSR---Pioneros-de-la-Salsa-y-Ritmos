services:
  postgres:
    image: postgres:18
    container_name: PSR-POSTGRES
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - PSR-POSTGRES:/var/lib/postgresql

volumes:
  PSR-POSTGRES:
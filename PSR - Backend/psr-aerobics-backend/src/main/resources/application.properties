# APPLICATION
spring.application.name=psr-aerobics-backend

# SERVER
server.port=8080

# DATABASE
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-in-ms=3600000
jwt.token-prefix=Bearer
jwt.header=Authorization
jwt.route.authentication.path=/api/auth/login
jwt.route.refresh.path=/api/auth/refresh

# EMAIL
# provider=smtp en local, provider=brevo en produccion. Solo se registra el sender correspondiente.
app.email.provider=${EMAIL_PROVIDER:smtp}
app.email.from-address=${EMAIL_FROM_ADDRESS:no-reply@psr-aerobicos.local}
app.email.from-name=${EMAIL_FROM_NAME:PSR Aerobicos}
app.email.brevo.api-key=${BREVO_API_KEY:}
app.email.brevo.url=https://api.brevo.com/v3/smtp/email

# SMTP (solo se usa cuando app.email.provider=smtp)
spring.mail.host=${SMTP_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:/db/migration
logging.level.org.flywaydb=DEBUG

# DOCKER COMPOSE
spring.docker.compose.enabled=false

# LOGGING
logging.level.org.hibernate.SQL=DEBUG

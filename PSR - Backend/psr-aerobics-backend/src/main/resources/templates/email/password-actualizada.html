<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tu contraseña fue actualizada</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5; font-family:Arial, Helvetica, sans-serif; color:#27272a;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:24px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:560px; background-color:#ffffff; border-radius:8px; padding:32px;">
                <tr>
                    <td>
                        <h1 style="margin:0 0 16px; font-size:22px; color:#18181b;">
                            ¡Hola<span th:if="${nombre}" th:text="' ' + ${nombre}"></span>!
                        </h1>

                        <p style="margin:0 0 16px; font-size:15px; line-height:1.6;">
                            La contraseña de tu cuenta en <strong>PSR Aeróbicos</strong> acaba de
                            cambiar.
                        </p>

                        <!--
                            El aviso existe para esto: si quien lo recibe no reconoce el cambio, es la
                            señal de que alguien más entró a la cuenta.
                        -->
                        <p style="margin:0; font-size:14px; line-height:1.6; color:#71717a;">
                            Si fuiste tú, no tienes que hacer nada. Si no reconoces este cambio, avísale
                            al administrador cuanto antes.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>

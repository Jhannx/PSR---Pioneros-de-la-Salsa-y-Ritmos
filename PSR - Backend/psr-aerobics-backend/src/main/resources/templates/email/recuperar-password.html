<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restablece tu contraseña</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5; font-family:Arial, Helvetica, sans-serif; color:#27272a;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:24px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:560px; background-color:#ffffff; border-radius:8px; padding:32px;">
                <tr>
                    <td>
                        <h1 style="margin:0 0 16px; font-size:22px; color:#18181b;">
                            ¡Hola<span th:if="${nombre}" th:text="' ' + ${nombre}"></span>!
                        </h1>

                        <p style="margin:0 0 24px; font-size:15px; line-height:1.6;">
                            Recibimos una solicitud para restablecer la contraseña de tu cuenta en
                            <strong>PSR Aeróbicos</strong>.
                        </p>

                        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 28px;">
                            <tr>
                                <td style="background-color:#18181b; border-radius:6px;">
                                    <a th:href="${enlace}" href="#"
                                       style="display:inline-block; padding:12px 24px; font-size:15px; font-weight:bold; color:#ffffff; text-decoration:none;">
                                        Restablecer contraseña
                                    </a>
                                </td>
                            </tr>
                        </table>

                        <p style="margin:0 0 16px; font-size:13px; line-height:1.6; color:#71717a;">
                            El enlace vence en <span th:text="${minutos}">30</span> minutos y solo puede
                            usarse una vez.
                        </p>

                        <p style="margin:0; font-size:13px; line-height:1.6; color:#71717a;">
                            Si no fuiste tú, ignora este mensaje: tu contraseña actual sigue funcionando.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>

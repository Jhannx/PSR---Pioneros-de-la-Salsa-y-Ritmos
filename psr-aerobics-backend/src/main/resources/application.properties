# APPLICATION
spring.application.name=psr-aerobics-backend

# SERVER
# ${PORT} y no 8080 fijo: Render, Railway, Heroku y Fly asignan el puerto por esa variable y enrutan
# el trafico hacia el. Una app que escucha en 8080 cuando el hoster le dijo 10000 no recibe nada, el
# health check falla y el despliegue se marca como caido — sin ningun error en el log de la app, que
# es lo que lo hace dificil de diagnosticar. En local, sin la variable, siguen siendo los 8080 de
# siempre.
server.port=${PORT:8080}

# DATABASE
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# SimpleJdbcCall emite la sintaxis de escape {call sp_x(...)}. El driver, por defecto
# (escapeSyntaxCallMode=select), la reescribe como SELECT * FROM sp_x(...) y busca una FUNCION; como
# todo lo nuestro son PROCEDURE, falla con "function sp_x(...) does not exist".
# callIfNoReturn usa CALL cuando no hay parametro de retorno ({? = call ...}), que es el caso de
# todos los repositorios de procedimientos, y deja el SELECT para las funciones si algun dia se
# llaman desde Java. Los parametros OUT siguen funcionando: viajan dentro del CALL.
spring.datasource.hikari.data-source-properties.escapeSyntaxCallMode=callIfNoReturn
# Zona de cada conexion, fijada por SQL y no por el driver. El driver manda la zona de la JVM al
# conectar, pero contra Neon la sesion quedaba en GMT igual (comprobado el 28-09 con
# TimeZoneStartupCheck), y ahi CURRENT_DATE pasa al dia siguiente a las 19:00: el check-in de la
# terminal no encontraba la sesion en curso y respondia 409. Un SET en la sesion gana sobre cualquier
# otra fuente. Requiere la URL directa de Neon, sin -pooler: con el pooler un SET no se conserva.
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'America/Bogota'

# JWT
jwt.secret=${JWT_SECRET}
# 30 días (antes 1 h). Provisional para v1: sin refresh token, la sesión expulsaba al login cada hora
# (TV de la fila, recepción). En v2 vuelve a ser corto cuando exista /api/auth/refresh.
jwt.expiration-in-ms=2592000000
jwt.token-prefix=Bearer
jwt.header=Authorization
jwt.route.authentication.path=/api/auth/login
jwt.route.refresh.path=/api/auth/refresh

# SEED DE PRODUCCION
# El admin de arranque, las tres terminales PSR, las cuentas compartidas Invitado y Menor de edad, y
# la agenda semanal. No son datos de prueba: sin el admin no hay por donde entrar a crear las cuentas
# reales, y sin horarios no hay clase a la que llegar.
#
# Encendido por defecto (matchIfMissing=true en el @ConditionalOnProperty): un despliegue al que se
# le olvide la variable arranca con cuentas, que es el fallo hacia el lado util. Se apaga cuando las
# cuentas reales ya existen, o para levantar la app contra una base ajena sin escribir en ella.
app.seed.production.enabled=${SEED_PRODUCTION_ENABLED:true}

# Credenciales del admin de arranque. Tienen valor por defecto a proposito: si fueran obligatorias,
# un despliegue sin definirlas arrancaria SIN NINGUN ADMIN y no habria por donde entrar. El defecto
# es una contrasena conocida —cambiala en el primer login— y eso se recupera; un sistema sin admin,
# no.
#
# Cambiar el correo NO renombra al admin que ya existe: la siembra es idempotente por correo, asi que
# apuntarlo a otra direccion sobre una base ya sembrada crea un SEGUNDO admin y deja el primero
# intacto con su contrasena vieja.
app.seed.production.admin-email=${ADMIN_EMAIL:adminpsraerobicos@gmail.com}
app.seed.production.admin-password=${ADMIN_PASSWORD:adminrootpsraerobicos}

# SEED DE PRUEBA
# Crea una cuenta por rol al arrancar, con la contrasena igual al numero de documento.
# NUNCA en produccion: son credenciales conocidas.
#
# Apagado por defecto desde el 28-09. Antes venia en true porque era lo unico que dejaba un ADMIN con
# el que entrar a una base recien migrada; eso ahora lo cubre ProductionAccountsSeeder, que corre
# siempre y sin bandera. Un default en true significaba que produccion sembraba credenciales
# conocidas salvo que alguien se acordara de poner SEED_TEST_ENABLED=false — el olvido fallaba hacia el
# lado inseguro. Ahora falla hacia el lado seguro: en local se enciende a proposito.
#
# Ya no siembra horarios: se fueron al seed de produccion el 28-09, porque eran el unico dato de
# operacion real atado a esta bandera.
app.seed.test.enabled=${SEED_TEST_ENABLED:false}

# SEED HISTORICO
# Cinco dias habiles de operacion ya transcurrida: ~30 asistentes por sesion, dinero, vueltos,
# reembolsos y una sesion cancelada con gente colgando. Sirve para revisar reportes, historiales y
# saldos sin fabricar los datos a mano.
# Bandera aparte de la de arriba a proposito: las cuentas de prueba se quieren casi siempre, y ciento
# cincuenta asistencias inventadas solo en el entorno de pruebas. Depende de la otra: sin sus cuentas
# de admin y profesor, no tiene a quien atribuir lo que escribe.
# Apagado por defecto. NUNCA en produccion.
app.seed.historical.enabled=${SEED_HISTORICAL_ENABLED:false}

# FRONTEND
# Base de los enlaces que viajan en los correos. Apuntan al front, no al backend: la persona
# necesita una pantalla donde escribir su contrasena nueva.
# 5173 y no 5174: 5173 es el puerto propio de Vite. 5174 es a lo que SALTA cuando 5173 ya esta
# ocupado, asi que como valor por defecto era justo el caso raro, y todos los enlaces de correo
# (bienvenida, restablecer password y confirmar cambio de correo) salian apuntando a un puerto donde
# normalmente no hay nada. En produccion esto lo pisa FRONTEND_URL.
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# CORS
# Propiedad compartida con WebSocketConfig: los origenes permitidos son los mismos para HTTP y para
# el handshake STOMP, y tenerlos en dos sitios es la forma segura de que se desincronicen.
# En produccion NO puede quedar en *.
# Lista separada por comas: Vite arranca en 5173 y va subiendo si el puerto esta ocupado, asi que se
# dejan los tres puertos que usa en la practica y no hace falta tocar esto cada vez que cambia.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:5173,http://localhost:5175}

# TOKENS DE CONTRASENA
# Invitacion: ventana larga, la persona puede abrir el correo dias despues y no queda fuera aunque
# caduque, porque siempre puede entrar con su numero de documento.
app.password-token.invitation-expiration-hours=48
# Recuperacion: ventana corta, la persona esta delante de la pantalla esperando el correo.
app.password-token.recovery-expiration-minutes=30
# Barrido de caducados, de madrugada: ya no sirven pero ocupan la fila UNIQUE del usuario.
# Lo comparten los tokens de contrasena y los de cambio de correo.
app.password-token.cleanup-cron=0 0 3 * * *

# CAMBIO DE CORREO
# Ventana larga (3 dias): a diferencia de la recuperacion, aqui nadie espera delante de la pantalla
# —el correo llega a un buzon que la persona quiza no consulta hoy— y el riesgo es menor, porque el
# enlace solo sirve para apuntar la cuenta a ese mismo buzon.
app.email-change.expiration-hours=72

# POLITICA DE TRATAMIENTO DE DATOS
# Version del documento que se congela en cada fila de consentimiento. La decision tomada es que la
# politica se queda en v1 unica, sin sistema de versiones, asi que esto es una propiedad y no una
# tabla: el dia que se publique una v2 se cambia aqui y las filas nuevas quedan marcadas solas, sin
# tocar las viejas ni perder quien acepto que texto.
app.privacy.policy-version=${PRIVACY_POLICY_VERSION:1.0}

# EMAIL
# provider=smtp en local, provider=brevo en produccion. Solo se registra el sender correspondiente.
app.email.provider=${EMAIL_PROVIDER:smtp}
app.email.from-address=${EMAIL_FROM_ADDRESS:no-reply@psr-aerobicos.local}
app.email.from-name=${EMAIL_FROM_NAME:PSR Aerobicos}
app.email.brevo.api-key=${BREVO_API_KEY:}
app.email.brevo.url=https://api.brevo.com/v3/smtp/email

# SMTP (solo se usa cuando app.email.provider=smtp)
spring.mail.host=${SMTP_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# SWAGGER
# Apagado por defecto. /swagger-ui/** y /v3/api-docs/** estan en permitAll(), asi que con la app en
# internet dejaban toda la API —endpoints de administracion incluidos— documentada y navegable por
# cualquiera: un mapa gratis.
# El defecto es false y no true a proposito: el olvido tiene que fallar hacia el lado cerrado. Para
# tenerlo en local se pone SWAGGER_ENABLED=true en el .env.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# JPA
spring.jpa.hibernate.ddl-auto=none
# show-sql y format_sql en false: en DEBUG llenan el disco y, peor, dejan en el log las consultas con
# sus valores — documentos, correos y telefonos de personas reales en un archivo que se rota, se
# envia a un agregador y lo lee gente que no tendria por que verlos.
# SQL_LOG=true los devuelve en local cuando haga falta depurar una consulta.
spring.jpa.show-sql=${SQL_LOG:false}
spring.jpa.properties.hibernate.format_sql=${SQL_LOG:false}

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:/db/migration
# INFO basta para ver que migraciones aplico y en cuanto tiempo; DEBUG imprime ademas cada sentencia.
logging.level.org.flywaydb=INFO

# LOGGING
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:INFO}
